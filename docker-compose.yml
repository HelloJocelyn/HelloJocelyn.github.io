services:
  backend:
    build:
      context: ./backend
    environment:
      - SQLITE_PATH=/data/app.db
    volumes:
      - ./backend:/app
      - backend-data:/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE=/api
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - backend

volumes:
  backend-data:
  frontend-node-modules:
